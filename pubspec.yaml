name: offro_user
description: Offro - Smart Savings Nearby

publish_to: 'none'
version: 1.0.1+27
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.1.0

  # QR Scanner
  mobile_scanner: ^7.4.0

  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Storage
  shared_preferences: ^2.2.2

  # Image picker
  image_picker: ^1.0.7

  # URL launcher
  url_launcher: ^6.2.5

  # Native Razorpay SDK — opens checkout directly (UPI, cards, wallets)
  razorpay_flutter: ^1.3.5
  share_plus: ^12.0.1        # FIX 12+14: Share vouchers & invoices
  printing: ^5.14.0          # FIX 14: PDF download for invoices (bumped for iOS stability)
  pdf: ^3.11.0              # FIX 14: Direct PDF generation (avoids convertHtml iOS crash)

  # Image caching — loads and caches network images locally
  cached_network_image: ^3.3.1

  # Image decoding/encoding for notification image resizing (was transitive dep)
  image: ^4.8.0
  flutter_staggered_grid_view: ^0.7.0

  # Shimmer skeleton loading effect
  shimmer: ^3.0.0

  # Video playback — for mp4 banner/slider support
  video_player: ^2.8.6

  # Firebase push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^22.2.0

  # MSG91 OTP Widget SDK (client-side OTP — no DLT needed)
  sendotp_flutter_sdk: ^0.0.2

  # Cupertino icons
  cupertino_icons: ^1.0.6

  # Sharing
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/onboarding/
    - assets/offers/
